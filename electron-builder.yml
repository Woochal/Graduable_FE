appId: com.se.graduable
productName: Graduable
copyright: Copyright © 2024

directories:
    buildResources: build
    output: dist

files:
    - dist/**/*
    - electron/**/*
    - public/**/*
    - 'package.json'

extraFiles:
    - from: src/assets
      to: resources/assets
      filter:
          - '**/*.pdf'
          - '**/*.html'
          - '**/*.png'

mac:
    category: public.app-category.education
    target:
        - target: dmg
    icon: src/assets/Logo.png
    darkModeSupport: true
    hardenedRuntime: true
    gatekeeperAssess: false
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    identity: 'Developer ID Application: Minhyeok Kim (GXC72G385T)'
    notarize:
        teamId: GXC72G385T

dmg:
    contents:
        - x: 130
          y: 220
        - x: 410
          y: 220
          type: 'link'
          path: '/Applications'
    window:
        width: 540
        height: 380

win:
    target:
        - target: nsis
    icon: src/assets/Logo.png

linux:
    target:
        - target: AppImage
        - target: deb
    icon: build/icon.png

publish:
    provider: github
    releaseType: draft

asar: true

nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: Graduable
